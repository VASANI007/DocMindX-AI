<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="sMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="sCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="190" height="140" rx="12" fill="#FDF2F8" stroke="#FCE7F3" stroke-width="1.5"/>
  <!-- Mat -->
  <rect x="18" y="105" width="164" height="7" rx="3.5" fill="url(#sMat)"/>
  
  <!-- Head on pillow / mat -->
  <circle cx="42" cy="94" r="10" fill="#F59E0B"/>
  
  <!-- Torso supine -->
  <path d="M 52 97 L 105 97" stroke="url(#sCloth)" stroke-width="15" stroke-linecap="round" fill="none"/>
  
  <!-- Legs extended relaxed -->
  <path d="M 105 97 L 160 102" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Feet relaxed turned out -->
  <line x1="160" y1="102" x2="168" y2="98" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms relaxed by side with palms up -->
  <path d="M 58 100 Q 80 104 105 104" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Calming Zen Waves -->
  <path d="M 35 65 Q 45 55 55 65 Q 65 75 75 65" stroke="#EC4899" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 90 55 Q 100 45 110 55 Q 120 65 130 55" stroke="#EC4899" stroke-width="1.5" fill="none" opacity="0.6"/>

  <text x="100" y="132" fill="#9D174D" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">CORPSE POSE (SHAVASANA)</text>
</svg>
