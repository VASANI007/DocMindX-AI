<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="cMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="190" height="140" rx="12" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1.5"/>
  <!-- Yoga Mat -->
  <rect x="20" y="112" width="160" height="8" rx="4" fill="url(#cMat)"/>
  
  <!-- Child's Pose Body (Balasana) -->
  <!-- Folded Lower Legs on heels -->
  <ellipse cx="145" cy="108" rx="18" ry="8" fill="#F59E0B"/>
  
  <!-- Hips resting on heels -->
  <circle cx="135" cy="95" r="14" fill="url(#cCloth)"/>
  
  <!-- Curved Spine / Back extending forward -->
  <path d="M 135 90 Q 105 78 75 92" stroke="url(#cCloth)" stroke-width="22" stroke-linecap="round" fill="none"/>
  
  <!-- Head resting gently on mat -->
  <circle cx="62" cy="104" r="11" fill="#F59E0B"/>
  
  <!-- Arms extended forward on mat -->
  <path d="M 80 96 Q 55 96 35 110" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none"/>

  <text x="100" y="136" fill="#065F46" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">CHILD'S POSE (BALASANA)</text>
</svg>
