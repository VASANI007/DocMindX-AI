<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="blisterFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Card Base -->
  <rect x="5" y="5" width="190" height="140" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Blister Pack -->
  <rect x="25" y="20" width="150" height="110" rx="8" fill="url(#blisterFoil)" stroke="#94A3B8" stroke-width="1.5" filter="url(#dropShadow)"/>
  <!-- Top Red Stripe with Label -->
  <path d="M 25 28 Q 25 20 33 20 L 167 20 Q 175 20 175 28 L 175 42 L 25 42 Z" fill="url(#redAccent)"/>
  <text x="100" y="34" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">PARACETAMOL 650mg</text>
  <!-- Pill Cavities Row 1 -->
  <rect x="35" y="50" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="53" y1="50" x2="53" y2="74" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="82" y="50" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="100" y1="50" x2="100" y2="74" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="129" y="50" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="147" y1="50" x2="147" y2="74" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Pill Cavities Row 2 -->
  <rect x="35" y="85" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="53" y1="85" x2="53" y2="109" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="82" y="85" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="100" y1="85" x2="100" y2="109" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="129" y="85" width="36" height="24" rx="12" fill="url(#pillGrad)" stroke="#64748B" stroke-width="1"/>
  <line x1="147" y1="85" x2="147" y2="109" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Bottom Brand Text -->
  <text x="100" y="122" fill="#475569" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">DOLO 650 / CALPOL IP</text>
</svg>
