<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="ibupFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="ibupPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="190" height="140" rx="12" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1.5"/>
  <rect x="25" y="20" width="150" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="25" y="20" width="150" height="22" rx="4" fill="url(#ibupFoil)"/>
  <text x="100" y="35" fill="#7C2D12" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">IBUPROFEN 400mg (BRUFEN)</text>
  <!-- Pills -->
  <circle cx="55" cy="62" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="47" y1="62" x2="63" y2="62" stroke="#FED7AA" stroke-width="1.5"/>

  <circle cx="100" cy="62" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="92" y1="62" x2="108" y2="62" stroke="#FED7AA" stroke-width="1.5"/>

  <circle cx="145" cy="62" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="137" y1="62" x2="153" y2="62" stroke="#FED7AA" stroke-width="1.5"/>

  <circle cx="55" cy="98" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="47" y1="98" x2="63" y2="98" stroke="#FED7AA" stroke-width="1.5"/>

  <circle cx="100" cy="98" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="92" y1="98" x2="108" y2="98" stroke="#FED7AA" stroke-width="1.5"/>

  <circle cx="145" cy="98" r="14" fill="url(#ibupPill)" stroke="#9A3412" stroke-width="1.5"/>
  <line x1="137" y1="98" x2="153" y2="98" stroke="#FED7AA" stroke-width="1.5"/>
  
  <text x="100" y="123" fill="#64748B" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">ANTI-INFLAMMATORY &amp; ANALGESIC</text>
</svg>
