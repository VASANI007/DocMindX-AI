<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="sachetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="190" height="140" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <!-- ORS Sachet -->
  <rect x="25" y="22" width="85" height="106" rx="6" fill="url(#sachetGrad)" stroke="#0C4A6E" stroke-width="1.5"/>
  <rect x="30" y="28" width="75" height="20" rx="3" fill="#FFFFFF"/>
  <text x="67" y="42" fill="#0369A1" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">ELECTRAL</text>
  <text x="67" y="60" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">WHO - ORS</text>
  <text x="67" y="74" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle">Oral Rehydration Salts</text>
  <line x1="33" y1="80" x2="101" y2="80" stroke="#38BDF8" stroke-width="1"/>
  <text x="67" y="93" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">RESTORES VITALITY</text>
  <text x="67" y="105" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">Dissolve in 1L Water</text>
  <circle cx="67" cy="118" r="4" fill="#38BDF8"/>
  
  <!-- Hydration Glass -->
  <polygon points="130,45 165,45 158,118 137,118" fill="url(#glassGrad)" stroke="#0284C7" stroke-width="1.8"/>
  <ellipse cx="147.5" cy="45" rx="17.5" ry="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <!-- Water drops -->
  <path d="M 148 65 Q 153 73 148 78 Q 143 73 148 65 Z" fill="#38BDF8"/>
  <path d="M 143 85 Q 148 93 143 98 Q 138 93 143 85 Z" fill="#38BDF8"/>
  <text x="147.5" y="134" fill="#0369A1" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">HYDRATION</text>
</svg>
